# Development stack: the relay, a Vault, and the process that keeps it unsealed.
#
# One port serves both audiences: /ui + /api for the dashboard, /agent/connect
# for the agents. The dashboard is LAN-only by design; BEACON_ADMIN_TOKEN below
# gates it, the API and the MCP endpoint, all three of which grant command
# execution on every connected machine.
#
# Unlike a typical dev stack this runs Vault sealed, exactly as production does,
# and lets the unseal supervisor initialise and open it. Dev mode would have
# been simpler, but then the unseal path would never be exercised until the
# first production reboot -- which is the worst possible time to discover it.
services:
  beacon-server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VERSION: dev
    image: go-beacon/server:dev
    container_name: beacon-server
    environment:
      BEACON_LISTEN: ":8080"
      # A fixed token is fine here and nowhere else: this file is for a laptop.
      BEACON_ADMIN_TOKEN: "${BEACON_ADMIN_TOKEN:-dev-operator-token}"
      BEACON_VAULT_ADDR: "http://vault:8200"
      BEACON_VAULT_TRANSIT_KEY: "beacon-agent-assertions"
      # AppRole, the same way production authenticates. `make vault-init`
      # mints these and writes them to .env, which Compose reads from here.
      BEACON_VAULT_ROLE_ID: "${BEACON_VAULT_ROLE_ID:-}"
      BEACON_VAULT_SECRET_ID: "${BEACON_VAULT_SECRET_ID:-}"
    ports:
      - "8080:8080"
    volumes:
      # Caches the transit public key so the relay keeps verifying agents while
      # Vault is sealed, restarting or unreachable.
      - beacon-state:/pki
    depends_on:
      # service_started, not service_healthy, and deliberately: the relay is
      # designed to keep serving a connected fleet through a Vault outage, so
      # making it wait for Vault would reintroduce the coupling that design
      # exists to avoid.
      vault:
        condition: service_started
    restart: unless-stopped

  vault:
    build:
      context: .
      dockerfile: vault/Dockerfile
    image: go-beacon/vault:dev
    container_name: beacon-vault
    # The development config, which turns memory locking off. A rootless
    # container runtime cannot grant an effective CAP_IPC_LOCK, and Vault would
    # refuse to start. Production uses vault.hcl and keeps the lock.
    command: ["server", "-config=/vault/beacon/vault-dev.hcl"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    # Not published, exactly as in production. Everything that needs Vault --
    # the relay, the unseal supervisor, `make vault-init` -- reaches it over the
    # compose network or through `compose exec`, so a host port would only widen
    # the surface. It also collides with the rootless port forwarder, which
    # binds inside the container's own namespace.
    expose:
      - "8200"
    volumes:
      - vault-data:/vault/file
    restart: unless-stopped

  # Initialises Vault on first run and keeps it unsealed afterwards. It is a
  # supervisor, not a one-shot: a host reboot brings Vault back sealed, and
  # nobody should have to notice.
  vault-unseal:
    build:
      context: .
      dockerfile: vault/Dockerfile
    image: go-beacon/vault:dev
    container_name: beacon-vault-unseal
    entrypoint: ["beacon-vault-unseal"]
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
      # A volume of its own. The unseal shares must not travel with a backup of
      # the data they open.
      - vault-unseal:/unseal
    depends_on:
      vault:
        condition: service_started
    restart: unless-stopped

volumes:
  beacon-state:
  vault-data:
  # Holds the unseal shares and the root token. Back this up separately from
  # vault-data, and never into the same archive.
  vault-unseal:
