<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go-beacon</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>go&#8209;beacon</h1>
  <div class="stats">
    <span><b id="stat-online">0</b> online</span>
    <span><b id="stat-known">0</b> known</span>
    <span>uptime <b id="stat-uptime">&mdash;</b></span>
    <span>v<b id="stat-version">&mdash;</b></span>
    <span id="stat-link" class="down">disconnected</span>
  </div>
</header>

<main>
  <section>
    <h2>Agents</h2>
    <table id="agents">
      <thead>
        <tr>
          <th>State</th><th>ID</th><th>Host</th><th>Platform</th><th>Remote</th>
          <th>For</th><th class="num">RTT</th><th class="num">Streams</th>
          <th class="num">In</th><th class="num">Out</th><th class="num">Reconn.</th><th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="empty">No agent has connected yet.</p>
  </section>

  <section>
    <h2>Events</h2>
    <ul id="events"></ul>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
